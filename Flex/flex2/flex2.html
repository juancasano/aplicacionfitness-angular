<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ejercicio Responsive Flex</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- HERO -->
  <header class="hero">
    <h1>Esta es nuestra web</h1>
  </header>

  <!-- CONTENIDO PRINCIPAL -->
  <main class="main-content">

    <!-- GRID DE PRODUCTOS -->
    <section class="product-grid">

      <div class="product-card">
        <img src="https://images.unsplash.com/photo-1588872657578-7efd1f1555ed?w=200&q=60" alt="Memoria USB" />
        <p>Memoria USB <span class="badge">1.0</span></p>
      </div>

      <div class="product-card">
        <img src="https://images.unsplash.com/photo-1583485088034-697b5bc54ccd?w=200&q=60" alt="Set escritura Pierre Cardine" />
        <p>Set escritura Pierre Cardine</p>
      </div>

      <div class="product-card">
        <img src="https://images.unsplash.com/photo-1549465220-1a8b9238cd48?w=200&q=60" alt="Caja regalo" />
        <p>Caja regalo</p>
      </div>

      <div class="product-card">
        <img src="https://images.unsplash.com/photo-1608043152269-423dbba4e7e1?w=200&q=60" alt="Altavoz bluetooth" />
        <p>Altavoz bluetooth</p>
      </div>

      <div class="product-card">
        <img src="https://images.unsplash.com/photo-1606220838315-056192d5e927?w=200&q=60" alt="Localizador bluetooth" />
        <p>Localizador bluetooth</p>
      </div>

      <div class="product-card">
        <img src="https://images.unsplash.com/photo-1586075010923-2dd4570fb338?w=200&q=60" alt="Carpeta de corcho" />
        <p>Carpeta de corcho</p>
      </div>

    </section>

    <!-- FORMULARIO -->
    <aside class="contact-form">
      <label for="nombre">Nombre:</label>
      <input type="text" id="nombre" placeholder="Nombre" />

      <label for="email">Correo electrónico</label>
      <input type="email" id="email" placeholder="eMail" />

      <button type="button">Enviar</button>
    </aside>

  </main>

  <!-- FOOTER -->
  <footer class="footer">
    <div>Comparte:</div>
    <div class="icons">
      <a href="#" class="icon-fb">f</a>
      <a href="#" class="icon-tw">t</a>
      <a href="#" class="icon-ig">♥</a>
      <a href="#" class="icon-pt">P</a>
    </div>
  </footer>

</body>
</html>
