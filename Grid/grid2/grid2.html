<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ejercicio Responsive Grid</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <div id="contenedor">
    <header class="hero">
      <h1>Esta es nuestra web</h1>
    </header>

    <main class="main-content">
      <figure class="product-card">
        <img src="https://images.unsplash.com/photo-1588872657578-7efd1f1555ed?w=200&q=60" alt="Memoria USB" />
        <figcaption>Memoria USB <span class="badge">1.0</span></figcaption>
      </figure>
      <figure class="product-card">
        <img src="https://images.unsplash.com/photo-1583485088034-697b5bc54ccd?w=200&q=60" alt="Set escritura" />
        <figcaption>Set escritura Pierre Cardine</figcaption>
      </figure>
      <figure class="product-card">
        <img src="https://images.unsplash.com/photo-1549465220-1a8b9238cd48?w=200&q=60" alt="Caja regalo" />
        <figcaption>Caja regalo</figcaption>
      </figure>
      <figure class="product-card">
        <img src="https://images.unsplash.com/photo-1608043152269-423dbba4e7e1?w=200&q=60" alt="Altavoz bluetooth" />
        <figcaption>Altavoz bluetooth</figcaption>
      </figure>
      <figure class="product-card">
        <img src="https://images.unsplash.com/photo-1606220838315-056192d5e927?w=200&q=60" alt="Localizador" />
        <figcaption>Localizador bluetooth</figcaption>
      </figure>
      <figure class="product-card">
        <img src="https://images.unsplash.com/photo-1586075010923-2dd4570fb338?w=200&q=60" alt="Carpeta" />
        <figcaption>Carpeta de corcho</figcaption>
      </figure>
    </main>

    <aside class="contact-form">
      <label for="nombre">Nombre:</label>
      <input type="text" id="nombre" placeholder="Nombre" />
      <label for="email">Correo electrónico</label>
      <input type="email" id="email" placeholder="eMail" />
      <button type="button">Enviar</button>
    </aside>

    <footer class="footer">
      <div>Comparte:</div>
      <div class="icons">
        <a href="#" class="icon-fb">f</a>
        <a href="#" class="icon-tw">t</a>
        <a href="#" class="icon-ig">♥</a>
        <a href="#" class="icon-pt">P</a>
      </div>
    </footer>
  </div>

</body>
</html>
