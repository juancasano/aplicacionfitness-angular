<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Modal Circles — Grid Mobile First</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <div class="grid">
    <button class="circle-btn c1" onclick="openModal(0)">Open Modal 01</button>
    <button class="circle-btn c2" onclick="openModal(1)">Open Modal 02</button>
    <button class="circle-btn c3" onclick="openModal(2)">Open Modal 03</button>
    <button class="circle-btn c4" onclick="openModal(3)">Open Modal 04</button>
  </div>

  <div class="overlay" id="overlay" onclick="handleOverlayClick(event)">
    <div class="modal" id="modal">
      <div class="modal-dot" id="modal-dot"></div>
      <h2 id="modal-title"></h2>
      <p id="modal-desc"></p>
      <button class="modal-close" onclick="closeModal()">Cerrar</button>
    </div>
  </div>

  <script src="script.js"></script>

</body>
</html>
