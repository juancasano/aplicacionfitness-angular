<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>JS13</title>
	
</head>
<body>
	Escribe una cadena de caracteres: <input type="text" id="cadena">
	<input type="button" value="Mostrar letras" onclick="mostrarLetras()">
	<div id="salida"></div>
    <script type="text/javascript">
		function mostrarLetras(){
			var cadena = document.getElementById("cadena").value;
			var resultado = '';
			for (var i=0; i<cadena.length; i++){
				resultado += `${cadena.charAt(i)}<br>`;
			}
			document.getElementById("salida").innerHTML = resultado;
		}
	</script>
</body>
</html>
