  { producto: "Portátil", categoria: "tecnologia", precio: 900 },
  { producto: "Ratón", categoria: "tecnologia", precio: 25 }
];


const ventasPorCategoria = ventas.reduce((acumulador, venta) => {

  if (!acumulador[categoria]) { //acumulador['ropa']
    acumulador[categoria] = [];
  }

  acumulador[categoria].push(venta);

  return acumulador;
}, {});

//reduce total por categoria

const totalPorCategoria = ventas.reduce((acumulador, venta) => {
  const categoria = venta.categoria;

  if (!acumulador[categoria]) {
    acumulador[categoria] = 0;
  }

  acumulador[categoria] += venta.precio;

  return acumulador;
}, {});
