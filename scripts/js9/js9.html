<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio JS9</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Ejercicio JS9</h1>
        <p>Introduce tu DNI para comprobar si la letra es correcta.</p>
        <input type="number" id="dni" placeholder="Número de DNI (sin letra)">
        <input type="text" id="letra" placeholder="Letra de tu DNI" maxlength="1">
        <button onclick="comprobarLetra()">Comprobar</button>
        <p id="resultado"></p>
    </div>
    <script src="script.js"></script>
</body>
</html>
