<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario Parpadee Modificado</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <h1 class="titulo">Formulario Parpadee</h1>

    <div class="contenedor-formulario">
        <form action="#" method="POST">
            <div class="grupo-entrada">
                <label for="nombre">Su nombre:</label>
                <input type="text" id="nombre" name="nombre" placeholder="Juan Pérez">
            </div>
            
            <div class="grupo-entrada">
                <label for="email">Su e-mail:</label>
                <input type="email" id="email" name="email" placeholder="juan@ejemplo.com">
            </div>

            <div class="grupo-entrada">
                <label for="edad">Su edad:</label>
                <input type="number" id="edad" name="edad" min="1" max="120" placeholder="25">
            </div>

            <div class="grupo-entrada">
                <label for="telefono">Teléfono:</label>
                <input type="tel" id="telefono" name="telefono" placeholder="+34 600 000 000">
            </div>

            <div class="grupo-entrada">
                <label for="mensaje">Mensaje:</label>
                <textarea id="mensaje" name="mensaje" rows="4" placeholder="Escribe tu mensaje aquí..."></textarea>
            </div>
            
            <button type="submit" class="btn-enviar">Enviar Formulario</button>
        </form>
    </div>

</body>
</html>
