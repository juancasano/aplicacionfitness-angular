<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Tablas</title>
</head>
<body>
<h1>Tablas</h1>
<table border=1 style="width:600px">
	<tr>
		<th style="width:100px;height: 100px;color:orange;">Col 1</th>
		<th style="width:250px;">Col 2</th>
		<th style="width:250px;">Col 3</th>
	</tr>
	<tr>
		<td>Celda 1.1<br>CeldaBis</td>
		<!-- text-align: center | left | right -->
		<!-- vertical-align: top | middle | bottom -->
		<td style="text-align:right;vertical-align: top;">Celda 1.2</td>
		<td rowspan="2">Celda 1.3</td>
	</tr>
	<tr>
		<td>Celda 2.1</td>
		<td>Celda 2.2<br>
		<span style="color:red;">Hola</span></td>

	</tr>	
	<tr>
		<td>Celda 3.1</td>
		<td colspan=2>Celda 3.2</td>
	</tr>
</table>	
</body>
</html>
