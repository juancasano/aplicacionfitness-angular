<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Tablas</title>
</head>
<body>
<h1>Tablas</h1>
<table border="1" style="border: 2px solid orange; color: red; background-color: dimgray;">

	<tr>
		<th style="width:100px; height: 100px; color: orange;">Col 1</th>
		<th>Col 2</th>
		<th>Col 3</th>
	</tr>
 <!-- text-algin: center / left / right
	  vertical-algin: top / middle / bottom  -->
	<tr>
	<td style="text-align: center;">Celda 1.1</td>
	<td>Celda 1.2</td>
	<td>Celda 1.3</td>
	</tr>
	<tr>
	<td>Celda 2.1</td>
	<td>Celda 2.2<br><strong style="color: blue;">celda</strong> 2.2.1</td>
	<td>Celda 2.3</td>
	</tr>
	<tr>
	<td>Celda 3.1</td>
	<td>Celda 3.2<br><strong style="color: blue;">celda</strong> 2.2.1</td>
	<td>Celda 3.3</td>
	</tr>
	<tr>
	<td>Celda 4.1</td>
	<td rowspan="2"></td>
	<td>Celda 4.3</td>
	</tr>
	<tr>
	<td>Celda 5.1</td>
	<td colspan="2">Celda 3.2</td>
	</tr>
</table>
</body>
</html>
